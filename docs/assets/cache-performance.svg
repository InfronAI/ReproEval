<svg xmlns="http://www.w3.org/2000/svg" width="960" height="360" viewBox="0 0 960 360"><rect width="960" height="360" rx="20" fill="#0b1120"/><g font-family="system-ui, sans-serif" fill="#e2e8f0"><text x="40" y="50" font-size="26">Repeated-prefix microbenchmark · M1 Pro</text><text x="40" y="82" font-size="15" fill="#94a3b8">Qwen2.5-3B 4-bit · 1,636–1,641 input tokens · greedy decoding · four warm calls per arm</text><text x="40" y="145" font-size="19">Without cache</text><rect x="230" y="120" width="480.9" height="40" rx="6" fill="#64748b"/><text x="760" y="147" font-size="21">4.146s</text><text x="40" y="215" font-size="19">With KV prefix cache</text><rect x="230" y="190" width="21.2" height="40" rx="6" fill="#38bdf8"/><text x="760" y="217" font-size="21">0.183s</text><text x="40" y="285" font-size="23" fill="#7dd3fc">22.7× lower warm-call latency in this synthetic test</text><text x="40" y="320" font-size="15" fill="#94a3b8">All 12 answers were identical. This is not an end-to-end benchmark speedup or an accuracy result.</text></g></svg>